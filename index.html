err('⏳ رجسٹریشن ہو رہی ہے...');let res=null;try{const u=await server();if(!u){err('⚠️ سرور کی ترتیب (config.json) نہیں ملی۔');return}const c=new AbortController();setTimeout(()=>c.abort(),12000);const r=await fetch(u+(u.indexOf('?')>0?'&':'?')+'a=signup&nm='+encodeURIComponent(nm)+'&n='+encodeURIComponent(n)+'&p='+encodeURIComponent(p)+'&d='+DC+'&t='+Date.now(),{redirect:'follow',cache:'no-store',signal:c.signal});res=await r.json()}catch(e){}
if(!res){err('📵 انٹرنیٹ نہیں ہے یا سرور نہیں مل رہا۔ دوبارہ کوشش کریں۔');return}
if(res.ok){err('✅ رجسٹریشن ہو گئی۔ منظوری کے بعد اسی نمبر اور پن سے لاگ ان کریں۔');$('sb').style.display='none';$('sw').style.display='';$('sw').onclick=()=>{const c=ls('dbk_ct');open('https://wa.me/'+(c||'')+'?text='+encodeURIComponent(tag('📝 نئی رجسٹریشن (منظوری درکار)',nm,n)+'\nالسلام علیکم! میں نے ایپ میں رجسٹریشن کی ہے، برائے مہربانی منظور کر دیں۔'),'_blank')};$('su').value=n;return}
err(res.r=='exists'?'ℹ️ یہ نمبر پہلے سے رجسٹر ہے۔ لاگ ان کریں۔':res.r=='full'?'⚠️ رجسٹریشن ابھی بند ہے۔ ایپ دینے والے سے رابطہ کریں۔':'❌ رجسٹریشن نہیں ہو سکی۔ معلومات چیک کریں۔')};
$('fg').onclick=()=>{const c=ls('dbk_ct'),n=$('nu').value.trim();if(!c){err('رابطہ نمبر ابھی مقرر نہیں۔ ایپ دینے والے سے براہ راست رابطہ کریں۔');return}open('https://wa.me/'+c+'?text='+encodeURIComponent(tag('🔑 پن بھول گیا ہوں','',n)+'\nالسلام علیکم! میں اپنا پن بھول گیا ہوں، براہ کرم مدد کریں۔'),'_blank')};
$('lo').onclick=()=>{if(!ls('dbk_n')&&!ls('dbk_kc')){err('اس موبائل پر کوئی لاگ ان محفوظ نہیں ہے۔');return}if(!confirm('اس موبائل سے لاگ آؤٹ کریں؟ محفوظ نمبر اور پن ہٹ جائیں گے۔'))return;['dbk_n','dbk_p','dbk_kc','dbk_ts'].forEach(k=>ls(k,null));$('nu').value='';$('pi').value='';$('lo').style.display='none';err('✅ لاگ آؤٹ ہو گیا۔')};
$('mb').onclick=()=>{const n=$('nu').value.trim(),p=$('pi').value.trim();if(!n||!p){err('نمبر اور پن دونوں لکھیں');return}go(n,p)};
const n0=ls('dbk_n'),p0=ls('dbk_p');if(n0&&p0){$('nu').value=n0;go(n0,p0)}
})();</script></body></html>
